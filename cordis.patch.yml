# The deepinfra-fusion-proxy profile bundle patch: two inserts over the profile
# root. Rows are addressed by id, so a later bundle layer or the user's own
# profile cordis.patch.yml can override either one (the last write wins per row).
#
# `./` module names resolve inside this bundle package, so the same patch works
# for a pnpm install from a git URL and for a copy dropped into the profile by
# hand. The UI row is the `ui/` package's host half (an empty apply, so the host
# Loader rosters it); its browser half is the package's exports["./client"],
# picked up by the client-module scan and injected into the composer's tool row
# plus the bundle row's configuration page.
#
# The host row's id is load-bearing on DSH 0.1.7+: a plugin's settings namespace
# IS its profile entry id, so the row id has to equal the namespace the legacy
# `settings.yaml` section and the browser card both address. Renaming it moves
# the settings form and stops the one-shot settings.yaml import from matching.

- insert:
    - id: deepinfra-proxy
      name: ./plugin/deepinfra-proxy.mjs
    - id: deepinfra-proxy-ui
      name: ./ui/lib/index.js
