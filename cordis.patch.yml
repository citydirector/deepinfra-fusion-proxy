# The deepinfra-fusion-proxy profile bundle patch: one row over the profile
# root. A later bundle layer or the user's own profile cordis.patch.yml can
# override it by id (the last write wins per row).
#
# The row names the PACKAGE, not a `./` path: DSH resolves a relative name to an
# absolute file URL, and the configuration editor copies that absolute URL into
# the user patch on its first save — which breaks the row as soon as a portable
# DSH folder moves. A package name resolves from the profile's node_modules
# wherever it lives. The package is a dual-face module: "." is the host plugin
# (which supervises server.js), "./client" the composer chip plus the row's
# configuration page.
#
# The row id is load-bearing: a plugin's settings namespace IS its profile
# entry id, so renaming it moves the settings form and orphans saved values.
# Releases before 2.1 named the row `./plugin/deepinfra-proxy.mjs` and shipped
# a second `deepinfra-proxy-ui` row; the host plugin rewrites a stale user-patch
# name on its first start.

- insert:
    - id: deepinfra-proxy
      name: deepinfra-fusion-proxy
